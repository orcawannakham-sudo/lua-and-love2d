name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Prepare love-android
        run: |
          cd "$GITHUB_WORKSPACE/build"

          echo "📂 $(pwd)"

          if [ ! -f "love-android/gradlew" ]; then
            echo "⚠️ gradlew missing"
            echo "📥 Downloading love-android..."

            rm -rf love-android
            git clone https://github.com/love2d/love-android.git love-android
          fi

          chmod +x love-android/gradlew

          echo "✅ Gradle wrapper:"
          ls -lh love-android/gradlew

      - name: 🔍 Validate settings
        run: |
          cd "$GITHUB_WORKSPACE/build"

          test -f apk-build-deta.txt || {
            echo "❌ apk-build-deta.txt missing"
            exit 1
          }

          appn=$(grep '^appn=' apk-build-deta.txt | cut -d= -f2-)
          pkgn=$(grep '^pkgn=' apk-build-deta.txt | cut -d= -f2-)

          if [ -z "$appn" ]; then
            echo "❌ appn is empty"
            exit 1
          fi

          if [ -z "$pkgn" ]; then
            echo "❌ pkgn is empty"
            exit 1
          fi

          if ! [[ "$pkgn" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "❌ Invalid package name: $pkgn"
            exit 1
          fi

          echo "✅ Settings valid"
          echo "📱 App: $appn"
          echo "📦 Package: $pkgn"

      - name: 🔨 Build
        run: |
          cd "$GITHUB_WORKSPACE/build"

          chmod +x ./build

          appn=$(grep '^appn=' apk-build-deta.txt | cut -d= -f2-)
          pkgn=$(grep '^pkgn=' apk-build-deta.txt | cut -d= -f2-)

          echo "================================"
          echo "🚀 BUILD START"
          echo "================================"
          echo "📂 $(pwd)"
          echo "📱 $appn"
          echo "📦 $pkgn"
          echo "================================"

          printf '%s\n%s\ny\n' "$appn" "$pkgn" | ./build

      - name: 📦 Find APK
        run: |
          cd "$GITHUB_WORKSPACE/build"

          echo "APK files:"

          find . -maxdepth 1 -type f -name "*.apk" -print

          apk=$(find . -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$apk" ]; then
            echo "❌ No APK found!"
            exit 1
          fi

          echo "✅ Found: $apk"

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: ${{ github.workspace }}/build/*.apk
          if-no-files-found: error
