name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"

      - name: Build APK
        run: |
          cd build

          echo "📂 Working directory:"
          pwd

          echo "📄 Files:"
          ls -la

          appn=$(grep '^appn=' apk-build-deta.txt | cut -d= -f2-)
          pkgn=$(grep '^pkgn=' apk-build-deta.txt | cut -d= -f2-)

          echo "📱 App: $appn"
          echo "📦 Package: $pkgn"
          echo "🧹 Clean: y"

          chmod +x build

          printf '%s\n%s\ny\n' "$appn" "$pkgn" | ./build

          if [ ! -f game.apk ]; then
            echo "❌ game.apk not found!"
            exit 1
          fi

          mv game.apk "${appn}.apk"

          echo "================================"
          echo "✅ BUILD SUCCESS!"
          echo "================================"
          echo "📱 APK: ${appn}.apk"
          echo "================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: build/*.apk
          if-no-files-found: error
